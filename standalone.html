function scienceHTML(){const s=stats(),over=all().filter(n=>n.children.length>CHUNK);return`<div class="stack"><div class="card"><div class="micro" style="margin-bottom:8px">Cognitive health — live</div><div><span class="dot" style="color:${s.doing>WIP?'#b06200':'#008a00'}"></span> <b>${s.doing}</b> tasks in progress — ${s.doing>WIP?'above':'within'} the ~4-item focus of attention.</div><div style="margin-top:8px"><span class="dot" style="color:${over.length?'#b06200':'#008a00'}"></span> ${over.length?`${over.length} branch(es) past 7±2: ${over.map(n=>esc(n.title)).join(', ')}`:'Every branch fits within 7±2.'}</div></div><div><div class="micro">Why this works — the research</div>${PRINCIPLES.map((p,i)=>`<div class="principle"><button data-science="${i}">${p[0]}<span>${scienceOpen===i?'−':'+'}</span></button>${scienceOpen===i?`<div class="content"><p>${p[1]}</p><p class="citation mono">${p[2]}</p></div>`:''}</div>`).join('')}</div></div>`}
function dataHTML(){return`<div class="stack"><div class="field"><span class="micro">Export</span><div class="row"><button class="pill small" id="export-json">JSON</button><button class="pill small" id="export-md">Markdown WBS</button><button class="pill small" id="copy-md">Copy outline</button></div></div><div class="field"><span class="micro">Import</span><button class="pill small" id="import" style="align-self:flex-start">Open JSON file…</button></div><div class="field" style="border-top:1px dashed rgba(17,17,17,.25);padding-top:12px"><span class="micro">Project</span><div class="row"><button class="pill small" id="load-sample">Load sample</button><button class="pill small" id="new-project">New project</button></div><p class="muted">Your map auto-saves to this browser. Export JSON to move it between devices or into git.</p></div></div>`}
function renderInspector(){
  $('#inspector').innerHTML=tab==='story'?storyHTML():tab==='details'?detailsHTML():tab==='links'?linksHTML():tab==='day'?scheduleHTML():tab==='science'?scienceHTML():dataHTML();$$('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#day-toggle').classList.toggle('active',tab==='day');$('#story-toggle').classList.toggle('active',tab==='story');
  const n=selected?find(selected):null;
  if($('#story-text')){$('#story-text').oninput=e=>storyDraft=e.target.value;$('#story-mode').onchange=e=>storyMode=e.target.value;$('#story-example').onclick=()=>{storyDraft=STORY_EXAMPLE;renderInspector()};$('#grow-mind').onclick=()=>growStory(false);if($('#offline-mind'))$('#offline-mind').onclick=()=>growStory(true)}
  $$('[data-field]').forEach(el=>el.onchange=()=>{if(!n)return;const field=el.dataset.field,value=el.value||undefined;if((field==='start'&&value&&n.end&&minutes(value)>=minutes(n.end))||(field==='end'&&value&&n.start&&minutes(value)<=minutes(n.start))){toast('End time must be later than the start time.',true);renderInspector();return}commit(()=>n[field]=value);if(data.deadlineLocked&&['due','start','end'].includes(field))autoAdjustDeadlines(false);else if(field==='due'&&value){day=value;renderInspector()}});
  $$('[data-status]').forEach(b=>b.onclick=()=>setStatus(n,b.dataset.status));$$('[data-priority]').forEach(b=>b.onclick=()=>commit(()=>n.priority=b.dataset.priority));
  if($('#milestone'))$('#milestone').onchange=e=>commit(()=>n.milestone=e.target.checked);
  if($('#meeting'))$('#meeting').onchange=e=>{commit(()=>{n.meeting=e.target.checked;if(n.meeting){n.due=n.due||day;n.start=n.start||'09:00';n.end=n.end||addMinutes(n.start,30);day=n.due}});toast(n.meeting?'Meeting anchor set':'Converted to a task')};
  if($('#add-child'))$('#add-child').onclick=()=>addChild(n.id);if($('#add-sibling'))$('#add-sibling').onclick=()=>addSibling(n.id);if($('#collapse'))$('#collapse').onclick=()=>commit(()=>n.collapsed=!n.collapsed);if($('#focus'))$('#focus').onclick=()=>{focused=n.id;selected=null;renderAll();fit()};if($('#delete'))$('#delete').onclick=()=>removeNode(n.id);
  if($('#add-dep'))$('#add-dep').onclick=()=>{const t=$('#target').value;if(!t)return toast('Choose a task first.',true);const depends=$('#direction').value==='depends';addDependency(depends?t:n.id,depends?n.id:t)};
  $$('[data-remove]').forEach(b=>b.onclick=()=>{const[from,to]=b.dataset.remove.split('|');commit(d=>d.dependencies=d.dependencies.filter(x=>!(x.from===from&&x.to===to)))});$$('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;tab='details';renderAll()});
  $$('[data-science]').forEach(b=>b.onclick=()=>{scienceOpen=scienceOpen===+b.dataset.science?-1:+b.dataset.science;renderInspector()});
  if($('#schedule-date'))$('#schedule-date').onchange=e=>{day=e.target.value||todayISO();renderInspector()};
  if($('#day-prev'))$('#day-prev').onclick=()=>{day=shiftDay(day,-1);renderInspector()};if($('#day-next'))$('#day-next').onclick=()=>{day=shiftDay(day,1);renderInspector()};if($('#day-today'))$('#day-today').onclick=()=>{day=todayISO();renderInspector()};
  if($('#day-add-task'))$('#day-add-task').onclick=()=>addScheduled('task');if($('#day-add-meeting'))$('#day-add-meeting').onclick=()=>addScheduled('meeting');
  if($('#project-deadline'))$('#project-deadline').onchange=e=>{const value=e.target.value;if(!value)return;commit(d=>d.deadline=value);if(data.deadlineLocked)autoAdjustDeadlines()};
  if($('#deadline-lock'))$('#deadline-lock').onchange=e=>{commit(d=>{d.deadline=d.deadline||shiftDay(todayISO(),7)+'T17:00';d.deadlineLocked=e.target.checked});if(data.deadlineLocked)autoAdjustDeadlines();else{scheduleWarning='';scheduleAdjustments=0;renderInspector();toast('Deadline unlocked · calendar items stay put')}};
  if($('#adjust-deadline'))$('#adjust-deadline').onclick=()=>{if(!data.deadline)commit(d=>d.deadline=$('#project-deadline').value);autoAdjustDeadlines()};
  if($('#export-json'))$('#export-json').onclick=()=>download(slug()+'.sunny.json',JSON.stringify(data,null,2),'application/json');if($('#export-md'))$('#export-md').onclick=()=>download(slug()+'.wbs.md',markdown(),'text/markdown');if($('#copy-md'))$('#copy-md').onclick=()=>navigator.clipboard.writeText(markdown()).then(()=>toast('Outline copied')).catch(()=>toast('Clipboard unavailable',true));if($('#import'))$('#import').onclick=()=>$('#file-input').click();if($('#load-sample'))$('#load-sample').onclick=()=>{if(confirm('Replace the current map with the sample project?')){data=sample();selected=focused=null;day=todayISO();scheduleWarning='';scheduleAdjustments=0;save();renderAll();fit()}};if($('#new-project'))$('#new-project').onclick=()=>{if(confirm('Start a new empty project?')){data=empty();selected=focused=null;day=todayISO();scheduleWarning='';scheduleAdjustments=0;save();renderAll();fit()}};
}
function selectNode(id){selected=id;$$('#map .node').forEach(node=>node.classList.toggle('selected',node.dataset.id===id));renderHeader();renderInspector()}
function renderAll(){renderHeader();draw();renderInspector()}
function slug(){return data.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cognimap'}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function markdown(){let out=`# ${data.name}\n`;if(data.deadline)out+=`\nFinal deadline: ${data.deadline.replace('T',' ')}${data.deadlineLocked?' (locked)':''}\n`;function rec(n,d){const schedule=n.due?` — ${n.due}${n.start?' '+n.start:''}${n.end?'–'+n.end:''}`:'';out+='\n'+'  '.repeat(d)+`- [${n.status==='done'?'x':' '}] ${n.title}${n.meeting?' **[meeting]**':''}${n.priority==='high'?' **(high)**':''}${schedule}`;n.children.forEach(c=>rec(c,d+1))}data.root.children.forEach(c=>rec(c,0));if(data.dependencies.length){out+='\n\n## Dependencies\n';data.dependencies.forEach(d=>out+=`\n- ${find(d.from)?.title} → ${find(d.to)?.title}`)}return out+'\n'}
// Events
$('#logo').setAttribute('points',Array.from({length:24},(_,i)=>{const a=i/24*Math.PI*2-Math.PI/2,r=i%2?8:11;return`${12+Math.cos(a)*r},${12+Math.sin(a)*r}`}).join(' '));
$('#project-name').onchange=e=>commit(d=>{d.name=e.target.value;d.root.title=e.target.value||d.root.title});
$('#story-toggle').onclick=()=>{tab='story';panelOpen=true;$('#aside').classList.remove('closed');$('#panel-toggle').classList.add('active');renderInspector();setTimeout(fit,230)};
$('#day-toggle').onclick=()=>{tab='day';panelOpen=true;$('#aside').classList.remove('closed');$('#panel-toggle').classList.add('active');renderInspector();setTimeout(fit,230)};
$('#panel-toggle').onclick=()=>{panelOpen=!panelOpen;$('#aside').classList.toggle('closed',!panelOpen);$('#panel-toggle').classList.toggle('active',panelOpen);setTimeout(fit,230)};
$('#zoom-in').onclick=()=>zoom(1.25);$('#zoom-out').onclick=()=>zoom(.8);$('#fit').onclick=fit;$('#whole-map').onclick=()=>{focused=null;selected=null;renderAll();fit()};
$$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderInspector()});
const svg=$('#map');
function startInertia(vx,vy){
  if(reducedMotion)return;const speed=Math.hypot(vx,vy);if(speed<.025)return;if(speed>1.7){vx*=1.7/speed;vy*=1.7/speed}let last=performance.now();
  function frame(now){const dt=Math.min(34,now-last);last=now;view.x+=vx*dt;view.y+=vy*dt;const decay=Math.pow(.91,dt/16.67);vx*=decay;vy*=decay;applyCamera();if(Math.hypot(vx,vy)>.018)inertiaFrame=requestAnimationFrame(frame);else inertiaFrame=0}
  inertiaFrame=requestAnimationFrame(frame)
}
function fieldParallax(e){if(reducedMotion||drag)return;const r=svg.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width-.5,ny=(e.clientY-r.top)/r.height-.5;$('#neural-field').style.transform=`translate3d(${(-nx*11).toFixed(2)}px,${(-ny*9).toFixed(2)}px,0)`}
svg.addEventListener('wheel',e=>{e.preventDefault();stopCameraMotion();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.max(.25,Math.min(3,view.k*Math.exp(-e.deltaY*.0012))),s=k/view.k;view={k,x:mx-(mx-view.x)*s,y:my-(my-view.y)*s};applyCamera()},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||(e.pointerType==='mouse'&&e.button!==0))return;stopCameraMotion();drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,time:performance.now(),vx:0,vy:0,moved:false};suppressBackgroundClick=false;svg.classList.add('dragging');svg.setPointerCapture?.(e.pointerId)});
svg.addEventListener('pointermove',e=>{fieldParallax(e);if(!drag||e.pointerId!==drag.id)return;const now=performance.now(),dt=Math.max(8,now-drag.time),dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY;view.x+=dx;view.y+=dy;drag.vx=drag.vx*.58+(dx/dt)*.42;drag.vy=drag.vy*.58+(dy/dt)*.42;drag.lastX=e.clientX;drag.lastY=e.clientY;drag.time=now;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>4)drag.moved=true;applyCamera()});
function endPan(e,cancelled=false){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;svg.classList.remove('dragging');if(d.moved)suppressBackgroundClick=true;if(!cancelled){const stale=performance.now()-d.time>100;startInertia(stale?0:d.vx,stale?0:d.vy)}}
svg.addEventListener('pointerup',e=>endPan(e));svg.addEventListener('pointercancel',e=>endPan(e,true));svg.addEventListener('pointerleave',()=>{if(!drag)$('#neural-field').style.transform='translate3d(0,0,0)'});
svg.addEventListener('click',e=>{if(e.target.closest('.node'))return;if(suppressBackgroundClick){suppressBackgroundClick=false;return}selectNode(null)});
$('#rename').addEventListener('keydown',e=>{if(e.key==='Enter')endRename();if(e.key==='Escape')endRename(false)});$('#rename').addEventListener('blur',()=>endRename());
window.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='Tab'){e.preventDefault();addChild(selected||focusRoot().id)}else if(e.key==='Enter'&&selected){e.preventDefault();addSibling(selected)}else if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();removeNode(selected)}else if(e.key===' '&&selected){e.preventDefault();const n=find(selected);if(n.children.length)commit(()=>n.collapsed=!n.collapsed)}else if((e.key==='f'||e.key==='F')&&selected){e.preventDefault();focused=selected;selected=null;renderAll();fit()}else if(e.key==='Escape'){if(selected){selected=null;renderAll()}else if(focused){focused=null;renderAll();fit()}}else if(e.key==='F2'&&selected){e.preventDefault();startRename(selected)}});
$('#file-input').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.root||!d.root.id||!Array.isArray(d.root.children))throw 0;data=d;selected=focused=null;day=todayISO();scheduleWarning='';scheduleAdjustments=0;save();renderAll();fit();toast('Map imported')}catch(x){toast('Not a valid Sunny JSON file',true)}});e.target.value=''};
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{drawNeuralField();fit()},120)});
$('#aside').classList.toggle('closed',!panelOpen);$('#panel-toggle').classList.toggle('active',panelOpen);
drawNeuralField();renderAll();fit();initialized=true;detectStoryEngine();
